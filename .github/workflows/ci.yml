name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep

      - name: Install pinned static analysis tools
        run: python3 -m pip install --break-system-packages shellcheck-py==0.11.0.1 ruff==0.15.19

      - name: Run repository checks
        run: make check

      - name: Validate the release archive after extraction
        run: scripts/test-package-relocation.sh
